name: ai-temp-whisper-build

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-whisper:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Build whisper.cpp and download multilingual model
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth 1 --branch v1.9.2 https://github.com/ggml-org/whisper.cpp.git
          cmake -S whisper.cpp -B whisper.cpp/build -DCMAKE_BUILD_TYPE=Release
          cmake --build whisper.cpp/build --config Release -j 2
          mkdir -p artifact
          cp whisper.cpp/build/bin/whisper-cli artifact/
          curl -L --fail --retry 5 -o artifact/ggml-small-q5_1.bin \
            https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-small-q5_1.bin
          sha256sum artifact/* > artifact/SHA256SUMS.txt
      - name: Upload Linux binary and model
        uses: actions/upload-artifact@v4
        with:
          name: whisper-linux-small-q5_1
          path: artifact/
          compression-level: 0
          retention-days: 1
