name: ai-temp-whisper-build

on:
  push:
    branches: [ai-temp-whisper-build-20260806]
    paths:
      - .github/workflows/ai-temp-whisper-build.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-whisper:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Build whisper.cpp and download multilingual model
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth 1 --branch v1.9.2 https://github.com/ggml-org/whisper.cpp.git
          cmake -S whisper.cpp -B whisper.cpp/build -DCMAKE_BUILD_TYPE=Release
          cmake --build whisper.cpp/build --config Release -j 2
          mkdir -p artifact
          cp whisper.cpp/build/bin/whisper-cli artifact/
          find whisper.cpp/build -name '*.so*' -exec cp -av '{}' artifact/ \;
          curl -L --fail --retry 5 -o artifact/ggml-small-q5_1.bin \
            https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-small-q5_1.bin
          (cd artifact && sha256sum ggml-small-q5_1.bin whisper-cli > SHA256SUMS.txt)
          LD_LIBRARY_PATH="$PWD/artifact" ldd artifact/whisper-cli
      - name: Upload Linux binary, shared libraries, and model
        uses: actions/upload-artifact@v4
        with:
          name: whisper-linux-small-q5_1
          path: artifact/
          compression-level: 0
          retention-days: 1
      - name: Record workflow run ID on the temporary branch
        shell: bash
        env:
          RUN_ID: ${{ github.run_id }}
          TEMP_BRANCH: ai-temp-whisper-build-20260806
        run: |
          set -euxo pipefail
          git clone --depth 1 --branch "$TEMP_BRANCH" "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" repo
          printf '%s\n' "$RUN_ID" > repo/ai-temp-whisper-run-id.txt
          cd repo
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ai-temp-whisper-run-id.txt
          git commit -m "chore: record temporary Whisper artifact run [skip ci]"
          git push origin "HEAD:$TEMP_BRANCH"
